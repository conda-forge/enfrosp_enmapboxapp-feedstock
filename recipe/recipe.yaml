schema_version: 1

context:
  name: enfrosp_enmapboxapp
  version: "0.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/enfrosp_enmapboxapp-${{ version }}.tar.gz
  sha256: 11edd6321204e75470c7f212211dbeba532a0d6df367a02f6c2e5f7648e14745

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.2
    - pip
  run:
    - python >=${{ python_min }}
    - enmapbox-lite
    - enfrosp >=0.2.2
    - packaging
    - psutil

tests:
  - python:
      imports:
        - enfrosp_enmapboxapp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A graphical user interface for EnFROSP as an add-in for the EnMAP-Box QGIS plugin
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://git.gfz-potsdam.de/EnMAP/GFZ_Tools_EnMAP_BOX/enfrosp_enmapboxapp

extra:
  recipe-maintainers:
    - danschef
