{% set name = "enfrosp_enmapboxapp" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/enfrosp_enmapboxapp-{{ version }}.tar.gz
  sha256: da8dbfb462432510b6b8047f32fc812db35c719122d99b1fbea50a89e928e2a5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.2
    - pip
  run:
    - python >={{ python_min }}
    - enfrosp >=0.1.2
    - packaging
    - psutil
    - qgis >=3.40.3

test:
  imports:
    - enfrosp_enmapboxapp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://git.gfz-potsdam.de/EnMAP/GFZ_Tools_EnMAP_BOX/enfrosp_enmapboxapp
  summary: A graphical user interface for EnFROSP as an add-in for the EnMAP-Box QGIS plugin
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - danschef
